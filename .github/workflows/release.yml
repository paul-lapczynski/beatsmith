# Builds the Windows installers (packaging/build.bat) and the macOS disk image
# (packaging/build-mac.sh). Push a tag like v1.2.0 to publish a GitHub release with
# all of them attached. Pull requests that touch packaging, and "Run workflow" on
# the Actions tab, make test builds kept as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  # a newer push to the same PR or tag replaces a build still running
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # a tag sets the version (v0.0.2 -> 0.0.2); test builds use 0.0.1
  STEPGEN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.1' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pick the version
        shell: bash
        run: echo "STEPGEN_VERSION=${STEPGEN_VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        env:
          # build.bat makes its venv with "py -3", which would pick the runner's newest
          # Python; onnxruntime has no wheels for that yet
          PY_PYTHON3: "3.12"
        run: packaging\build.bat

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.STEPGEN_VERSION }}
          path: |
            packaging/dist/*.msi
            packaging/dist/*.exe

  mac:
    runs-on: macos-latest       # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the version
        run: echo "STEPGEN_VERSION=${STEPGEN_VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          PYTHON: python
        run: sh packaging/build-mac.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ env.STEPGEN_VERSION }}
          path: packaging/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
