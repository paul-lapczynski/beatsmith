# Builds the Windows installers (packaging/build.bat) and the macOS disk image
# (packaging/build-mac.sh). Every merge to main builds both, so a tag goes on a
# commit known to build; push a tag like v1.2.0 to publish a GitHub release with
# all of them attached. Pull requests make the same test builds, kept as workflow
# artifacts, as does "Run workflow" on the Actions tab. Changes to docs and
# pictures alone don't build.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]                  # tags always build; the paths below don't apply to them
    paths:
      # everything goes into the build except docs, pictures and side folders;
      # later lines win, so packaging and this workflow always count
      - "**"
      - "!**/*.md"
      - "!**/*.png"
      - "!docs/**"
      - "!dialtest/**"
      - "!training/**"
      - "!reviews/**"
      - "!branding/**"
      - "!examples/**"
      - "!.github/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  pull_request:
    paths:                        # the same list as above
      # everything goes into the build except docs, pictures and side folders;
      # later lines win, so packaging and this workflow always count
      - "**"
      - "!**/*.md"
      - "!**/*.png"
      - "!docs/**"
      - "!dialtest/**"
      - "!training/**"
      - "!reviews/**"
      - "!branding/**"
      - "!examples/**"
      - "!.github/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:

concurrency:
  # a newer push to the same PR replaces a build still running; every merge to
  # main and every tag builds in full
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # build.bat downloads ffmpeg only when packaging/ffmpeg is missing
      - uses: actions/cache@v4
        with:
          path: packaging/ffmpeg
          key: ffmpeg-7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pick the version
        shell: bash
        run: |
          version=$(python packaging/version.py)
          echo "BEATSMITH_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check installer versions
        run: python -m unittest discover -s packaging -p "test_*.py"

      - name: Build
        shell: cmd
        env:
          # build.bat makes its venv with "py -3", which would pick the runner's newest
          # Python; onnxruntime has no wheels for that yet
          PY_PYTHON3: "3.12"
          # the Inno Setup .exe installer only goes into releases
          BEATSMITH_SKIP_EXE: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: packaging\build.bat

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.BEATSMITH_VERSION }}
          path: |
            packaging/dist/*.msi
            packaging/dist/*.exe

  mac:
    runs-on: macos-latest       # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pick the version
        run: |
          version=$(python packaging/version.py)
          echo "BEATSMITH_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check installer versions
        run: python -m unittest discover -s packaging -p "test_*.py"

      - name: Build
        env:
          PYTHON: python
        run: sh packaging/build-mac.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ env.BEATSMITH_VERSION }}
          path: packaging/dist/*.dmg

  # the add-on packs the installed app downloads (addons.py): built and tested
  # on each platform, attached to the release beside the installers
  addons:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test the packs
        run: python packaging/addon_pack.py packs

      - name: Keep the packs
        uses: actions/upload-artifact@v4
        with:
          name: addons-${{ matrix.os }}
          path: |
            packs/*.zip
            packs/*.tar.gz
          compression-level: 0          # already compressed
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, addons]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail before publishing unless every installer and add-on is present.
          test "$(find out -maxdepth 1 -name '*.msi' | wc -l)" -eq 1
          test "$(find out -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find out -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          for kind in stems lyrics; do
            test -s "out/BeatSmith-addon-$kind-windows-x64.zip"
            test -s "out/BeatSmith-addon-$kind-mac-arm64.tar.gz"
          done
          # Release Please supplies a draft with reviewed changelog notes.
          # Manual tags still work, but stage assets in a draft first too.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
