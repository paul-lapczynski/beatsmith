# Builds the Windows installers (packaging/build.bat) and the macOS disk image
# (packaging/build-mac.sh). Every merge to main builds both, so a tag goes on a
# commit known to build; push a tag like v1.2.0 to publish a GitHub release with
# all of them attached. Pull requests make the same test builds, kept as workflow
# artifacts, as does "Run workflow" on the Actions tab. Changes to docs and
# pictures alone don't build.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]                  # tags always build; the paths below don't apply to them
    paths:
      # everything goes into the build except docs, pictures and side folders;
      # later lines win, so packaging and this workflow always count
      - "**"
      - "!**/*.md"
      - "!**/*.png"
      - "!docs/**"
      - "!dialtest/**"
      - "!training/**"
      - "!reviews/**"
      - "!branding/**"
      - "!examples/**"
      - "!.github/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:                        # the same list as above
      # everything goes into the build except docs, pictures and side folders;
      # later lines win, so packaging and this workflow always count
      - "**"
      - "!**/*.md"
      - "!**/*.png"
      - "!docs/**"
      - "!dialtest/**"
      - "!training/**"
      - "!reviews/**"
      - "!branding/**"
      - "!examples/**"
      - "!.github/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  # a newer push to the same PR replaces a build still running; every merge to
  # main and every tag builds in full
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  # a tag sets the version (v0.0.2 -> 0.0.2); test builds use 0.0.1
  BEATSMITH_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.1' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # build.bat downloads ffmpeg only when packaging/ffmpeg is missing
      - uses: actions/cache@v4
        with:
          path: packaging/ffmpeg
          key: ffmpeg-7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pick the version
        shell: bash
        run: echo "BEATSMITH_VERSION=${BEATSMITH_VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        env:
          # build.bat makes its venv with "py -3", which would pick the runner's newest
          # Python; onnxruntime has no wheels for that yet
          PY_PYTHON3: "3.12"
          # the Inno Setup .exe installer only goes into releases
          BEATSMITH_SKIP_EXE: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: packaging\build.bat

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.BEATSMITH_VERSION }}
          path: |
            packaging/dist/*.msi
            packaging/dist/*.exe

  mac:
    runs-on: macos-latest       # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pick the version
        run: echo "BEATSMITH_VERSION=${BEATSMITH_VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          PYTHON: python
        run: sh packaging/build-mac.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ env.BEATSMITH_VERSION }}
          path: packaging/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
