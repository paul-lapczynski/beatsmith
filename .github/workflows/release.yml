# Builds the Windows installer with packaging/build.bat.
# Push a tag like v1.2.0 to publish a GitHub release with the installer attached;
# Pull requests that touch packaging, and "Run workflow" on the Actions tab, make a
# test build kept as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "STEPGEN_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        run: packaging\build.bat

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ env.STEPGEN_VERSION }}
          path: |
            packaging/dist/*.msi
            packaging/dist/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" packaging/dist/*.msi packaging/dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes
